<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Space Talk</title>
    <!-- Favicon / Logo in title -->
    <link rel="icon" type="image/png" href="logo.png">

    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f8fafc;
            --surface-color: #ffffff;
            --surface-border: #e2e8f0;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --danger: #ef4444;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            background-image:
                    radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.05) 0px, transparent 50%),
                    radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.04) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Navigation / Brand Header */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.25rem 2rem;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--surface-border);
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .brand-logo {
            height: 50px;
            width: auto;
            object-fit: contain;
        }

        .brand-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        /* Status Pills */
        .status-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.875rem;
        }

        /* Animation from original code */
        @keyframes changeColor {
            0% { color: #059669; }
            50% { color: #2563eb; }
            100% { color: #059669; }
        }

        .sinulabel {
            font-weight: 700;
            font-family: monospace;
            background: rgba(79, 70, 229, 0.08);
            padding: 3px 8px;
            border-radius: 6px;
            animation: changeColor 4s infinite ease both;
        }

        /* Main Container */
        #container {
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.75rem;
        }

        /* Card Component */
        .card {
            background: var(--surface-color);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        /* Session Bar Controls */
        .session-panel {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .session-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
        }

        .session-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* Inputs & Buttons */
        input[type="text"] {
            background: #ffffff;
            border: 1px solid var(--surface-border);
            color: var(--text-main);
            padding: 0.65rem 1rem;
            border-radius: var(--radius-md);
            outline: none;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            min-width: 220px;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        button {
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 0.65rem 1.25rem;
            border-radius: var(--radius-md);
            border: none;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary {
            background-color: var(--primary);
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-success {
            background-color: var(--success);
            color: #ffffff;
        }

        .btn-success:hover {
            filter: brightness(0.95);
            transform: translateY(-1px);
        }

        .btn-outline {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--surface-border);
        }

        .btn-outline:hover {
            background: rgba(0, 0, 0, 0.02);
            color: var(--text-main);
        }

        /* Video Stage Grid */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .video-box {
            position: relative;
            background: #0f172a;
            border-radius: var(--radius-lg);
            overflow: hidden;
            border: 1px solid var(--surface-border);
            aspect-ratio: 4 / 3;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.1);
        }

        .video-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .video-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(8px);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* Developer & Debug Diagnostics Section */
        .debug-section {
            border-top: 1px solid var(--surface-border);
            padding-top: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .debug-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            font-weight: 600;
        }

        .debug-buttons {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }

        /* Dynamic Status Feedback */
        #session_connection_status {
            color: #059669;
            font-weight: 500;
        }

        #session_connection_status_error, #ws_conn_lbl_err {
            color: var(--danger);
            font-weight: 500;
        }

        #ws_conn_lbl {
            color: var(--success);
            font-weight: 500;
        }

        @media (max-width: 640px) {
            .session-panel {
                flex-direction: column;
                align-items: stretch;
            }
            .session-actions {
                flex-direction: column;
                align-items: stretch;
            }
            input[type="text"], button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
<section id="app"></section>

<!-- Main Header -->
<header>
    <a href="#" class="brand-container" title="Space Talk">
        <!-- Logo inside body -->
        <img src="logo-png.png" alt="Space Talk Logo" class="brand-logo" onerror="this.style.display='none'">
        <h1 class="brand-title">Space Talk</h1>
    </a>

    <!-- Top Connection & Error Status -->
    <div class="status-container">
        <label id="session_connection_status"></label>
        <label id="session_connection_status_error"></label>
    </div>
</header>

<div id="container">

    <!-- Session Control Hub -->
    <div class="card session-panel">
        <div class="session-info">
            <label id="sessionid_heading" style="color: var(--text-muted);">Hosting Session ID:</label>
            <label class="sinulabel" id="sessionid_lbl"></label>
        </div>

        <div class="session-actions">
            <input type="text" id="sid_input" name="sid_input" placeholder="Enter Session ID to join..."/>
            <button id="connect_to_session" class="btn-primary">Connect to Session</button>
            <button id="start_session" class="btn-success">Start Session</button>
        </div>
    </div>

    <!-- Video Stage -->
    <div class="video-grid">
        <!-- Peer A Video Box -->
        <div class="video-box">
            <div class="video-badge">
                <a title="Peer A Video" style="color: inherit; text-decoration: none;">Peer A Video</a>
            </div>
            <video id="peer_a_video" autoplay muted></video>
        </div>

        <!-- Peer B Video Box -->
        <div class="video-box">
            <div class="video-badge">
                <a title="Peer B Video" style="color: inherit; text-decoration: none;">Peer B Video</a>
            </div>
            <video id="peer_b_video" autoplay muted playsinline></video>
        </div>
    </div>

    <!-- Developer & Debug Diagnostics Section -->
    <div class="card debug-section">
        <span class="debug-title">Diagnostics & Server State</span>
        <div class="debug-buttons">
            <button id="debug_client_state" class="btn-outline">Print Client State</button>
            <label id="ws_conn_lbl"></label>

            <button id="debug_signal_server_state" class="btn-outline">Print Signalling Server State (Terminal)</button>
            <label id="ws_conn_lbl_err"></label>
        </div>
    </div>

</div>

<!-- WASM Client Script -->
<script type="module">
    import init from '/pkg/client.js';
    init('/pkg/client_bg.wasm');
</script>
</body>

</html>
